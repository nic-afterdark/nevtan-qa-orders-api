server.port=${PORT:8080}
spring.application.name=orders-api

# Every level is switched on so the log viewer has all four to filter on.
logging.level.root=INFO
logging.level.com.nevtan.qa.orders=DEBUG

# Timestamps are UTC so what the container prints can be compared against
# what the log viewer shows without doing timezone maths in your head.
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS,UTC
